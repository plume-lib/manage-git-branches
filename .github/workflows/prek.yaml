name: Prek style checks
# Pushes to branches other than `main` are tested by the `pull_request` event.
# Running on every push would test each pull request commit twice.
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - uses: j178/prek-action@v3.1.0
