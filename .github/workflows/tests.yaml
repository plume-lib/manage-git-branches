name: Tests
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    # A commit pushed to the head branch of an open pull request from this
    # repository triggers both a `push` and a `pull_request` event.  Skip the
    # `pull_request` run, which would duplicate the `push` run.  A pull request
    # from a fork has no `push` run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - run: tests/run-tests.sh
