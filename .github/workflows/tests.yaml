name: Tests
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # A commit pushed to a pull request's branch triggers both a `push` and
        # a `pull_request` event.  macOS runners are slow and expensive, so run
        # the macOS tests only for the `pull_request` event.  (A job-level `if`
        # cannot refer to the matrix, so the matrix itself depends on the event.)
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - run: tests/run-tests.sh
