name: Tests
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # The scripts are POSIX shell and use no GNU-only utility options, so
        # they must work on macOS as well as on Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - run: tests/run-tests.sh
      - run: tests/run-tests
