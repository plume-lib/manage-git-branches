name: Bench (temporary)
"on": [push]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - run: scratch-bench/bench2.sh
      - name: baseline tests
        run: for t in test-git-new-branch.sh test-push-to-rerere.sh test-git-remove-branch-directory.sh; do s=$(date +%s); tests/$t > /dev/null 2>&1; echo "BASE $t status=$? $(( $(date +%s) - s ))s"; done
      - name: fsync none tests
        run: |
          sed -i.bak 's/\[receive\]/[core]\\n\\tfsync = none\\n[receive]/' tests/lib-git-test-env.sh
          grep -n 'fsync' tests/lib-git-test-env.sh
          for t in test-git-new-branch.sh test-push-to-rerere.sh test-git-remove-branch-directory.sh; do s=$(date +%s); tests/$t > /dev/null 2>&1; echo "FSYNC $t status=$? $(( $(date +%s) - s ))s"; done
      - name: parallel 3 of the three tests
        run: |
          s=$(date +%s)
          printf '%s\n' test-git-new-branch.sh test-push-to-rerere.sh test-git-remove-branch-directory.sh | xargs -P 3 -I{} sh -c 'tests/{} > /dev/null 2>&1; echo "PAR {} $?"'
          echo "PAR total $(( $(date +%s) - s ))s"
