name: checkbashisms

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    # A commit pushed to a branch of this repository triggers both a `push` and
    # a `pull_request` event.  Skip the `pull_request` run, which would duplicate
    # the `push` run.  A pull request from a fork has no `push` run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - uses: luizm/action-sh-checker@v0.10.0
        with:
          # No "sh_checker_only_diff: true" because the workflow also runs on
          # `push` and because without environment variable `GITHUB_TOKEN`, it
          # silently finds no files and thus does nothing.
          sh_checker_checkbashisms_enable: true
          # shfmt and shellcheck are run by `prek`.
          sh_checker_shfmt_disable: true
          sh_checker_shellcheck_disable: true
          # Space-separated list of regexes matched against each file name.
          # povray is third-party code that is not maintained here.
          # checkbashisms cannot check zsh scripts.
          sh_checker_exclude: >-
            gradlew
            tests/kvasir-tests/povray/
            scripts/eps2png-mono-alpha[.]zsh
