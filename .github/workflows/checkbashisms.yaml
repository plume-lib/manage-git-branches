name: Shell Linting

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - uses: luizm/action-sh-checker@v0.9.0
        with:
          sh_checker_only_diff: true
          sh_checker_checkbashisms_enable: true
