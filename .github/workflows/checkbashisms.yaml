name: Shell Linting

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      # No "sh_checker_only_diff: true" because the workflow also runs on `push`.
      - uses: luizm/action-sh-checker@v0.10.0
        with:
          sh_checker_checkbashisms_enable: true
