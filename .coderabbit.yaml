# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# This file is shared, nearly verbatim, across all of the author's
# repositories.  Most of the filters below concern languages, ecosystems, and
# files that do not appear in this repository.  A filter is therefore not
# evidence that this repository contains such a file.

language: "en-US"

reviews:
  profile: "assertive"
  high_level_summary: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  in_progress_fortune: false
  poem: false
  path_filters:
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!**/__init__.py"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/out/**"
  auto_review:
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
      - "wip"
      - "draft"
    ignore_usernames:
      - "app/renovate"
      - "dependabot"
      - "dependabot[bot]"
      - "mend"
      - "renovate"
      - "renovate[bot]"
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"

chat:
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/.cursorrules"
      - "**/CODING_STANDARDS.md"
